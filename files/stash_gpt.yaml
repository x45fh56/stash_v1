  - ConfigX2ray
  - FreakConfig
  - Maznet
  - NetShot1
  - dingyue_center
  - new_mtproxi2
  - oneclickvpnkeys
  - persianvpnhub
  - pythash
  - tv2rayrr
  - v2ray_extractor
- name: SELECT
  type: select
  proxies:
  - AUTO-IRAN
  - BrilliantGift
  - ConfigX2ray
  - FreakConfig
  - Maznet
  - NetShot1
  - dingyue_center
  - new_mtproxi2
  - oneclickvpnkeys
  - persianvpnhub
  - pythash
  - tv2rayrr
  - v2ray_extractor
